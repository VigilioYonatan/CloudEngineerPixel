name: DevSecOps quality and browser verification
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: devsecops-${{ github.ref }}
  cancel-in-progress: true
jobs:
  code-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout (read-only)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies deterministically
        run: npm ci
      - name: Static source and multicloud coverage (no cloud credentials)
        run: npm run verify:source
      - name: Strict TypeScript
        run: npm run typecheck
      - name: Unit, curriculum, security and integrity tests
        run: npm test
      - name: Biome code quality
        run: npm run lint
      - name: Production compilation
        run: npm run build
      - name: Bundle performance budget gate
        run: npm run bundle:budget
      - name: Local secret pattern scan
        run: npm run security:scan
      - name: DevSecOps browser source controls
        run: npm run security:audit
      - name: Verify preserved files
        run: npm run integrity
      - name: Dependency vulnerability audit (0 prod vulns + OpenVEX dev gate)
        run: npm audit --omit=dev --audit-level=high && npm run security:sca
      - name: Generate and validate CycloneDX SBOM
        run: npm sbom --sbom-format cyclonedx > sbom.cdx.json && npm run sbom:check
      - name: Archive SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 14
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: End-to-end smoke (AWS / Azure / GCP / Senior Mode)
        run: npm run test:e2e
      - name: Attach browser traces on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
