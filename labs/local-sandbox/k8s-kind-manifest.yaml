# Cloud Engineering Academy · Manifiesto de práctica local para Kind (Kubernetes in Docker)
# Incluye Namespace, Deployment non-root con probes/resources, PodDisruptionBudget y NetworkPolicy fail-closed.
apiVersion: v1
kind: Namespace
metadata:
  name: cea-sandbox
  labels:
    app.kubernetes.io/part-of: cloud-engineering-academy
    environment: local-kind
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workload-api
  namespace: cea-sandbox
spec:
  replicas: 2
  selector:
    matchLabels:
      app: workload-api
  template:
    metadata:
      labels:
        app: workload-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: http-echo
          image: hashicorp/http-echo:1.0.0
          args:
            - "-listen=:8080"
            - "-text=ok"
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "150m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: workload-api-pdb
  namespace: cea-sandbox
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: workload-api
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: cea-sandbox
spec:
  podSelector: {}
  policyTypes:
    - Ingress
